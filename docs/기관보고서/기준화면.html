<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!--
  기관 보고서 기준 화면 (2026-11-20, 대표 확정)
  - 숫자와 한마디는 모두 견본이에요. 모아(DB)와 연결되어 있지 않아요.
  - 아래 스크립트의 COURSES 묶음만 바꾸면 화면 전체가 다시 그려져요.
  - 관리자 화면(admin/)으로 옮길 때는 같은 폴더의 구현메모.md 를 먼저 읽어요.
  - 이 파일은 docs 폴더라 사이트 주소로는 열리지 않아요(_config.yml exclude). 내려받아 브라우저로 열어요.
-->
<title>모아 강좌 결과 보고서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
  /* 배치: 위에서부터 강좌 정보 → 한 일 숫자 4칸 → 왼쪽 넓은 칸에 전후 비교, 오른쪽에 만족도·진행 단계 → 한마디 → 자료 설명.
     모아 관리자 화면의 색(아이보리·짙은 초록·금색)과 글꼴을 그대로 따르는 한 가지(밝은) 모습. */
  :root{
    color-scheme: light;
    --ivory:#F2EEE2; --ivory-light:#FAF8F2; --paper:#FFFFFF;
    --green:#0B3324; --green-mid:#5C8A74; --green-soft:#DCE8E0;
    --ink:#23261F; --gray-1:#4C4A40; --gray-2:#6F6D63;
    --gold:#D4AF37; --gold-deep:#8A6E22;
    --line:#CFC8AE; --line-2:#E4DDCB;
    --serif:'Noto Serif KR','Nanum Myeongjo',serif;
    --sans:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased}
  h1,h2,.serif{font-family:var(--serif)}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .top{background:var(--ivory-light);border-bottom:1px solid var(--line-2)}
  .top-in,.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .top-in{padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-weight:700;color:var(--green);font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand span{color:var(--gold-deep)}
  .chip{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--gold-deep);border:1.5px solid var(--gold);border-radius:999px;padding:2px 11px;background:var(--paper)}
  .pick{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray-1);font-weight:700}
  .pick select{font:inherit;font-weight:500;color:var(--ink);padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);max-width:100%}

  .wrap{padding-block:24px 40px;display:flex;flex-direction:column;gap:18px}
  .head h1{font-size:27px;line-height:1.3;color:var(--green);margin:0 0 8px;text-wrap:balance}
  .facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;padding:0;list-style:none;color:var(--gray-1);font-size:15px}
  .facts b{color:var(--gray-2);font-weight:500;margin-right:6px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{background:var(--ivory-light);border:1px solid var(--line-2);border-radius:10px;padding:14px 18px}
  .stat .lab{font-size:14px;color:var(--gray-2)}
  .stat .num{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.25;color:var(--green);font-variant-numeric:tabular-nums}
  .stat .num small{font-family:var(--sans);font-size:15px;font-weight:500;color:var(--gray-1);margin-left:3px}
  .stat .sub{font-size:13.5px;color:var(--gray-2)}

  .cols{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:18px;align-items:stretch}
  .change{display:flex;flex-direction:column}
  .side{display:flex;flex-direction:column;gap:18px;min-width:0}
  .panel{background:var(--ivory-light);border:1px solid var(--line-2);border-radius:10px;padding:20px 22px;min-width:0}
  .panel h2{font-size:19px;color:var(--green);margin:0 0 2px}
  .panel .desc{font-size:14px;color:var(--gray-2);margin:0 0 14px}

  /* 전후 비교(아령 모양 그림): 한 가지 색의 두 단계, 전 = 빈 고리, 후 = 채운 점 */
  .legend{display:flex;gap:18px;font-size:13.5px;color:var(--gray-1);margin:0 0 6px}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
  .dot-pre{background:var(--paper);border:3px solid var(--green-mid)}
  .dot-post{background:var(--green);border:3px solid var(--green)}
  .rows{display:flex;flex-direction:column;flex:1}
  .row{display:grid;grid-template-columns:176px minmax(0,1fr) 172px;gap:6px 16px;align-items:center;flex:1;padding:16px 0;border-top:1px solid var(--line-2);position:relative}
  .row:first-child{border-top:none}
  .row .area{font-weight:700;color:var(--green);font-size:16px;line-height:1.35}
  .row .q{display:block;font-weight:400;color:var(--gray-2);font-size:12.5px;line-height:1.4;margin-top:2px}
  .track{position:relative;height:40px;margin:0 34px}
  .track::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,var(--line-2) 1px,transparent 1px) 0 0/25% 100%;border-right:1px solid var(--line-2)}
  .bar{position:absolute;top:50%;height:4px;margin-top:-2px;background:var(--green-mid);border-radius:2px}
  .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--ivory-light)}
  .val{position:absolute;top:50%;font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--ivory-light);padding:0 3px;line-height:1.3}
  .val.lo{transform:translate(calc(-100% - 12px),-50%)}
  .val.hi{transform:translate(12px,-50%)}
  .val.pre{color:var(--gray-2);font-weight:500}
  .res{font-size:14px;color:var(--gray-1);line-height:1.4}
  .res b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
  .tip{position:absolute;left:192px;bottom:calc(100% - 8px);z-index:5;background:var(--green);color:var(--ivory-light);font-size:13px;line-height:1.5;padding:8px 12px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
  .row:hover,.row:focus-visible{background:rgba(11,51,36,.035)}
  .row:hover .tip,.row:focus-visible .tip{opacity:1}
  .axis{display:grid;grid-template-columns:176px minmax(0,1fr) 172px;gap:16px;border-top:1px solid var(--line);padding-top:6px}
  .axis-in{position:relative;height:36px;margin:0 34px;font-size:12.5px;color:var(--gray-2);font-variant-numeric:tabular-nums}
  .axis-in span{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.35}

  /* 만족도·진행 단계: 가는 막대 */
  .meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin-bottom:12px}
  .meter .lab{font-size:14.5px;color:var(--gray-1)}
  .meter .v{font-size:14.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .meter .v small{font-weight:500;color:var(--gray-2)}
  .meter .t{grid-column:1/-1;height:8px;border-radius:4px;background:var(--green-soft);overflow:hidden}
  .meter .t i{display:block;height:100%;background:var(--green);border-radius:4px}
  .orgbox{border-top:1px dashed var(--line);margin-top:4px;padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px;color:var(--gray-1)}
  .orgbox b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .orgbox small{display:block;font-size:12.5px;color:var(--gray-2)}

  .quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:0;padding:0;list-style:none}
  .quotes li{background:var(--paper);border-left:4px solid var(--gold);padding:12px 16px;border-radius:0 8px 8px 0}
  .quotes p{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.65;color:var(--ink)}
  .quotes span{font-size:13px;color:var(--gray-2)}

  .note{font-size:13.5px;color:var(--gray-2);line-height:1.7;border-top:1px solid var(--line);padding-top:12px;margin:0}

  @media (max-width:900px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .cols{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:600px){
    .head h1{font-size:22px}
    .row,.axis{grid-template-columns:minmax(0,1fr)}
    .axis>div:first-child,.axis>div:last-child{display:none}
    .tip{left:0}
    .stat .num{font-size:27px}
  }
  @media (prefers-reduced-motion:reduce){.tip{transition:none}}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">인물대백과사 <span>·</span> 모아 <span>·</span> 강좌 결과 보고서 <span class="chip">견본 자료</span></div>
    <label class="pick" for="course">강좌
      <select id="course"></select>
    </label>
  </div>
</header>

<main class="wrap">
  <section class="head">
    <h1 id="c-name"></h1>
    <ul class="facts" id="c-facts"></ul>
  </section>

  <section class="stats" id="c-stats" aria-label="한 일 숫자"></section>

  <div class="cols">
    <section class="panel change">
      <h2>달라진 값: 수업 전과 후</h2>
      <p class="desc" id="c-change-desc"></p>
      <div class="legend" aria-hidden="true">
        <span><i class="dot-pre"></i>첫 수업(전)</span>
        <span><i class="dot-post"></i>마지막 수업(후)</span>
      </div>
      <div class="rows" id="c-rows"></div>
      <div class="axis" aria-hidden="true">
        <div></div>
        <div class="axis-in">
          <span style="left:0%">1<br>전혀 아니다</span>
          <span style="left:25%">2</span>
          <span style="left:50%">3<br>보통</span>
          <span style="left:75%">4</span>
          <span style="left:100%">5<br>매우 그렇다</span>
        </div>
        <div></div>
      </div>
    </section>

    <div class="side">
      <section class="panel">
        <h2>만족도</h2>
        <p class="desc" id="c-sat-desc"></p>
        <div id="c-sat"></div>
      </section>
      <section class="panel">
        <h2>AI와 쓰기 진행</h2>
        <p class="desc">각 단계까지 가 본 수강생 수예요.</p>
        <div id="c-steps"></div>
      </section>
    </div>
  </div>

  <section class="panel">
    <h2>수강생 한마디</h2>
    <p class="desc">본인이 싣는 데 동의한 한마디만 실어요.</p>
    <ul class="quotes" id="c-quotes"></ul>
  </section>

  <p class="note" id="c-note"></p>
</main>

<script>
// 견본 자료예요. 실제 강좌에서는 이 묶음만 바꾸면 화면 전체가 다시 그려져요.
// 전후 설문: 구글폼 응답 / 한 일 숫자: 모아 관리자 화면 / 기관 조사: 기관이 준 값
const COURSES = [
  { id:'a', label:'견본 강좌 A · ○○노인복지관',
    name:'내 인생 자서전 쓰기 8주 과정', org:'○○노인복지관', period:'2026.09.02 ~ 10.21', sessions:8,
    people:16, paired:14, posts:92, books:13, steps:[16,16,14,13],
    areas:[
      {k:'디지털 자신감', q:'휴대폰으로 글을 쓰고 사진을 넣을 수 있다', pre:2.1, post:3.9, up:13, same:1, down:0},
      {k:'글쓰기 자신감', q:'내 이야기를 글로 쓸 수 있다', pre:2.6, post:4.0, up:12, same:2, down:0},
      {k:'삶 돌아보기', q:'내가 살아온 삶이 의미 있다고 느낀다', pre:3.4, post:4.1, up:10, same:3, down:1},
      {k:'사람들과의 관계', q:'내 이야기를 가족·이웃과 나눈다', pre:3.3, post:3.6, up:6, same:6, down:2}
    ],
    sat:{n:15, overall:4.6, again:13, recommend:14, org:{score:4.5, n:16}},
    quotes:[
      {t:'휴대폰으로 글을 쓴다는 게 처음엔 겁이 났는데, 이제는 손주에게 내 책을 보내 줘요.', who:'70대 수강생'},
      {t:'잊고 살던 어머니 이야기를 쓰면서 많이 울고 많이 웃었어요.', who:'60대 수강생'},
      {t:'아직 못 쓴 이야기가 많아요. 다음에도 또 듣고 싶어요.', who:'70대 수강생'}
    ]
  },
  { id:'b', label:'견본 강좌 B · △△도서관',
    name:'스마트폰으로 쓰는 나의 이야기 6주 과정', org:'△△도서관', period:'2026.10.06 ~ 11.10', sessions:6,
    people:12, paired:11, posts:51, books:8, steps:[12,12,10,8],
    areas:[
      {k:'디지털 자신감', q:'휴대폰으로 글을 쓰고 사진을 넣을 수 있다', pre:2.4, post:3.8, up:10, same:1, down:0},
      {k:'글쓰기 자신감', q:'내 이야기를 글로 쓸 수 있다', pre:2.9, post:3.9, up:9, same:2, down:0},
      {k:'삶 돌아보기', q:'내가 살아온 삶이 의미 있다고 느낀다', pre:3.6, post:4.0, up:7, same:3, down:1},
      {k:'사람들과의 관계', q:'내 이야기를 가족·이웃과 나눈다', pre:3.5, post:3.4, up:4, same:4, down:3}
    ],
    sat:{n:12, overall:4.4, again:10, recommend:11, org:null},
    quotes:[
      {t:'말로 하면 글자가 되는 게 신기했어요. 눈이 침침해도 쓸 수 있더라고요.', who:'70대 수강생'},
      {t:'내 이름이 적힌 책 표지를 보니 가슴이 뭉클했어요.', who:'60대 수강생'}
    ]
  }
];
const STEP_NAMES = ['생각하기','초고','퇴고','담기'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => (v - 1) / 4 * 100;          // 1~5점 자를 0~100%로
const one = v => v.toFixed(1);
const signed = d => (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(1);

function meter(label, valueHtml, ratio){
  return `<div class="meter"><span class="lab">${label}</span><span class="v">${valueHtml}</span><div class="t"><i style="width:${Math.round(ratio*100)}%"></i></div></div>`;
}

function render(c){
  $('c-name').textContent = c.name;
  $('c-facts').innerHTML = [['기관',c.org],['기간',c.period],['횟수',c.sessions+'회'],['참여',c.people+'명']]
    .map(([k,v]) => `<li><b>${k}</b>${esc(v)}</li>`).join('');

  const top = c.areas.reduce((m,a) => (a.post - a.pre) > (m.post - m.pre) ? a : m);
  $('c-stats').innerHTML = [
    ['참여 인원', c.people, '명', `전·후 설문 모두 응답 ${c.paired}명`],
    ['쓴 글', c.posts, '편', `한 사람당 ${one(c.posts/c.people)}편`],
    ['완성한 책', c.books, '권', `${c.people}명 중 ${c.books}명이 완성`],
    ['가장 크게 오른 영역', signed(top.post - top.pre), '점', `${top.k} · ${one(top.pre)} → ${one(top.post)}`]
  ].map(([lab,num,unit,sub]) => `<div class="stat"><div class="lab">${lab}</div><div class="num">${num}<small>${unit}</small></div><div class="sub">${sub}</div></div>`).join('');

  $('c-change-desc').textContent = `같은 질문을 첫 수업과 마지막 수업에 물었어요. 두 번 모두 답한 ${c.paired}명의 평균이에요.`;
  $('c-rows').innerHTML = c.areas.map(a => {
    const d = Math.round((a.post - a.pre) * 10) / 10;
    const lo = Math.min(a.pre, a.post), w = Math.abs(a.post - a.pre);
    const preCls = a.pre <= a.post ? 'lo' : 'hi', postCls = a.pre <= a.post ? 'hi' : 'lo';
    return `<div class="row" tabindex="0" aria-label="${esc(a.k)}: 전 ${one(a.pre)}점, 후 ${one(a.post)}점. ${c.paired}명 중 ${a.up}명이 올랐어요.">
      <div class="area">${esc(a.k)}<span class="q">${esc(a.q)}</span></div>
      <div class="track">
        <span class="bar" style="left:${pct(lo)}%;width:${w/4*100}%"></span>
        <span class="dot dot-pre" style="left:${pct(a.pre)}%"></span>
        <span class="dot dot-post" style="left:${pct(a.post)}%"></span>
        <span class="val pre ${preCls}" style="left:${pct(a.pre)}%">${one(a.pre)}</span>
        <span class="val ${postCls}" style="left:${pct(a.post)}%">${one(a.post)}</span>
      </div>
      <div class="res"><b>${signed(d)}점</b>${c.paired}명 중 ${a.up}명이 올랐어요</div>
      <div class="tip" role="presentation">전 ${one(a.pre)}점 → 후 ${one(a.post)}점 · 오름 ${a.up}명 · 같음 ${a.same}명 · 내림 ${a.down}명</div>
    </div>`;
  }).join('');

  const s = c.sat;
  $('c-sat-desc').textContent = `마지막 수업에 물은 3문항이에요. 응답 ${s.n}명.`;
  $('c-sat').innerHTML =
    meter('수업에 전체적으로 만족해요', `${one(s.overall)} <small>/ 5</small>`, s.overall/5) +
    meter('다음에도 다시 듣고 싶어요', `${s.again}명 <small>/ ${s.n}명</small>`, s.again/s.n) +
    meter('주변에 추천하고 싶어요', `${s.recommend}명 <small>/ ${s.n}명</small>`, s.recommend/s.n) +
    (s.org ? `<div class="orgbox"><span>기관 자체 만족도 조사<small>기관이 준 값을 그대로 실었어요 · 응답 ${s.org.n}명</small></span><b>${one(s.org.score)} / 5</b></div>` : '');

  $('c-steps').innerHTML = c.steps.map((n,i) => meter(STEP_NAMES[i], `${n}명 <small>/ ${c.people}명</small>`, n/c.people)).join('');

  $('c-quotes').innerHTML = c.quotes.map(q => `<li><p>“${esc(q.t)}”</p><span>${esc(q.who)}</span></li>`).join('');

  $('c-note').textContent = `자료 설명: 달라진 값은 전·후 설문에 모두 답한 ${c.paired}명 기준이에요. 질문은 모아가 직접 만든 8문항(5단계)이고 검증된 심리 검사가 아니에요. 개인별 점수는 싣지 않고 반 전체 값만 실어요. 이 화면의 숫자와 한마디는 화면을 보여 주기 위한 견본이에요.`;
}

const sel = $('course');
sel.innerHTML = COURSES.map(c => `<option value="${c.id}">${esc(c.label)}</option>`).join('');
sel.addEventListener('change', () => render(COURSES.find(c => c.id === sel.value)));
render(COURSES[0]);
</script>
</body>
</html>
